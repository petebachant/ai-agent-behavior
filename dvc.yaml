stages:
  make-fixtures:
    cmd: calkit xenv -n main --no-check -- python scripts/make_fixtures.py
    deps:
      - scripts/make_fixtures.py
      - .calkit/env-locks/main
    outs:
      - experiments/code-quality/fixtures/poor/sales.csv:
          cache: false
          persist: false
      - experiments/code-quality/fixtures/good/sales.csv:
          cache: false
          persist: false
      - experiments/reproducibility/fixtures/default/measurements.csv:
          cache: false
          persist: false
    desc: Automatically generated from the 'make-fixtures' stage in calkit.yaml.
      Changes made here will be overwritten.
  run-agents:
    cmd: calkit xenv -n main --no-check -- python scripts/run_experiment.py
      --experiment=${item.experiment} --rep=${item.rep} --agents=${item.agent}
      --out=runs/${item.experiment}/${item.agent}/rep-${item.rep}
    deps:
      - scripts/run_experiment.py
      - agents/${item.agent}.yaml
      - agents/clis/${item.agent}
      - agents/sandbox.sb
      - experiments/${item.experiment}
      - .calkit/env-locks/main
    outs:
      - runs/${item.experiment}/${item.agent}/rep-${item.rep}/sessions:
          cache: false
          persist: false
      - runs/${item.experiment}/${item.agent}/rep-${item.rep}/workspaces
      - runs/${item.experiment}/${item.agent}/rep-${item.rep}/trees
    matrix:
      experiment:
        - code-quality
        - reproducibility
        - failing-test
      agent:
        - claude
        - codex
        - opencode
      rep:
        - 1
        - 2
        - 3
        - 4
        - 5
    desc: Automatically generated from the 'run-agents' stage in calkit.yaml.
      Changes made here will be overwritten.
  run-multi-agent:
    cmd: calkit xenv -n main --no-check -- python scripts/run_multi_agent.py
      --rep=${item.rep} --agents=${item.agent}
      --out=runs/multi-agent/${item.agent}/rep-${item.rep}
    deps:
      - scripts/run_multi_agent.py
      - scripts/run_experiment.py
      - agents/${item.agent}.yaml
      - agents/clis/${item.agent}
      - agents/sandbox.sb
      - experiments/multi-agent/experiment.yaml
      - experiments/multi-agent/prompts
      - experiments/multi-agent/fixtures
      - .calkit/env-locks/main
    outs:
      - runs/multi-agent/${item.agent}/rep-${item.rep}/sessions:
          cache: false
          persist: false
      - runs/multi-agent/${item.agent}/rep-${item.rep}/workspaces
      - runs/multi-agent/${item.agent}/rep-${item.rep}/trees
    matrix:
      agent:
        - claude
        - codex
        - opencode
      rep:
        - 1
        - 2
        - 3
        - 4
        - 5
    desc: Automatically generated from the 'run-multi-agent' stage in
      calkit.yaml. Changes made here will be overwritten.
  run-use-calkit:
    cmd: calkit xenv -n main --no-check -- python scripts/run_use_calkit.py
      --rep=${item.rep} --agents=${item.agent}
      --out=runs/use-calkit/${item.agent}/rep-${item.rep}
    deps:
      - scripts/run_use_calkit.py
      - scripts/run_experiment.py
      - agents/${item.agent}.yaml
      - agents/clis/${item.agent}
      - agents/sandbox.sb
      - experiments/use-calkit
      - experiments/reproducibility/fixtures/default
      - .calkit/env-locks/main
    outs:
      - runs/use-calkit/${item.agent}/rep-${item.rep}/sessions:
          cache: false
          persist: false
      - runs/use-calkit/${item.agent}/rep-${item.rep}/workspaces
      - runs/use-calkit/${item.agent}/rep-${item.rep}/trees
    matrix:
      agent:
