# Coding agents treated as experimental subjects. Each is invoked through its
# CLI's non-interactive mode inside the Seatbelt sandbox in sandbox.sb, with
# a fresh home directory per run so no memory, user instructions, or prior
# sessions carry over between runs.
claude:
  cli: claude
  model: claude-opus-5-5
codex:
  cli: codex
  model: gpt-6-luna
opencode:
  cli: opencode
  model: opencode/deepseek-v4.1-flash-free
