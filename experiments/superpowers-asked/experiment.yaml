# A third arm of the superpowers experiment, added after Claude Code with
# Superpowers installed never invoked one of its skills in the first 20
# builds: the same build, with Superpowers installed, where each user's
# request is the one in ../superpowers with one sentence added asking the
# agent to use Superpowers, starting with brainstorming. The personas,
# notes, hidden checks, and follow-up change are the superpowers
# experiment's own, and scripts/run_superpowers_asked.py refuses to run if
# anything below other than the conditions and requests differs from
# ../superpowers/experiment.yaml.
timeout_minutes: 240
project_name: kitty
superpowers:
  repo: https://github.com/obra/superpowers.git
  version: 7.0.2
  commit: 22f0b463e7a5e579904dd6211a520321035526f7
  marketplace: superpowers-dev
user:
  model: claude-opus-5-5
  max_replies: 40
users:
  dev:
    request: user/dev/request.md
    persona: ../superpowers/user/dev/persona.md
    notes: ../superpowers/user/dev/notes.md
  nondev:
    request: user/nondev/request.md
    persona: ../superpowers/user/nondev/persona.md
    notes: ../superpowers/user/nondev/notes.md
conditions:
  dev-asked:
    user: dev
    superpowers: true
  nondev-asked:
    user: nondev
    superpowers: true
