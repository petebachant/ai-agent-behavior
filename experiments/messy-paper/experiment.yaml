# A messy research project (a tow-tank cylinder drag study: raw data in two
# formats, chained scripts with duplicated logic, a notebook, a stale
# figure, hand-typed numbers in lab notes, an incomplete requirements.txt,
# and no Git) and two requests made of it, each by a fresh agent in a fresh
# home: write the paper, then, as if months later, address the reviews.
# The project is generated by scripts/make_messy_paper_fixture.py.
#
# Calkit is installed the usual way in both conditions and Docker is
# available through a Colima VM, so the conditions differ only in the
# write prompt: in `calkit`, it ends with "Use Calkit." The revise prompt
# is the same for both.
project_name: towtank-drag
fixture: fixture
calkit_version: 0.50.3
python: "3.13"
rounds:
  write:
    prompt: prompts/write.md
    timeout_minutes: 60
  revise:
    prompt: prompts/revise.md
    timeout_minutes: 45
conditions:
  plain:
    write_suffix: ""
  calkit:
    write_suffix: " Use Calkit."
