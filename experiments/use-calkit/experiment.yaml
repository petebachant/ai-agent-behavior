# The everyday analysis request from the reproducibility experiment, on the
# same data, with one sentence added: "Use Calkit." Calkit is installed the
# usual way, as a uv tool with its own uv-managed Python, so it's on the
# PATH, but nothing else on the machine mentions it.
project_name: elastic-modulus
prompt: prompt.md
timeout_minutes: 30
calkit_version: 0.49.3
python: "3.13"
conditions:
  # Only the Calkit CLI
  cli:
    fixture: ../reproducibility/fixtures/default
    skills: false
  # Also Calkit's agent skills, installed as its docs say for each agent
  skills:
    fixture: ../reproducibility/fixtures/default
    skills: true
