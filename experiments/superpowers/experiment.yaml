# The same request for a greenfield tool, made of Claude Code as installed
# (default) and with the Superpowers plugin installed (superpowers), in a
# conversation with a simulated user who answers from private notes: a
# developer (dev) or someone who isn't one (nondev), whose requests and
# notes say the same things in their own words. Neither request mentions
# Superpowers. Hidden checks in checks/ score the results: test_stated.py
# checks what the request states, and test_unstated.py what only the notes
# give. The reference implementation in reference/ passes all of them, and
# an empty project none. Each build then gets the follow-up change in
# change/, to measure how maintainable it is.
timeout_minutes: 240
project_name: kitty
superpowers:
  repo: https://github.com/obra/superpowers.git
  version: 7.0.2
  commit: 22f0b463e7a5e579904dd6211a520321035526f7
  # The name Superpowers' own marketplace.json gives its marketplace
  marketplace: superpowers-dev
user:
  model: claude-opus-5-5
  # Replies after the request, after which the run ends unfinished
  max_replies: 40
users:
  dev:
    request: user/dev/request.md
    persona: user/dev/persona.md
    notes: user/dev/notes.md
  nondev:
    request: user/nondev/request.md
    persona: user/nondev/persona.md
    notes: user/nondev/notes.md
conditions:
  dev-default:
    user: dev
    superpowers: false
  dev-superpowers:
    user: dev
    superpowers: true
  nondev-default:
    user: nondev
    superpowers: false
  nondev-superpowers:
    user: nondev
    superpowers: true
