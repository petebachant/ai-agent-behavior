# A follow-up change to each finished kitty build, to measure how
# maintainable it is: a fresh Claude Code, as installed (never with
# Superpowers), in a fresh home with the build's project folder as the
# build left it (without virtual environments or caches), asked by the
# developer persona to add two features. The request states them fully, so
# the notes say only to use judgment. Hidden checks in checks/ test the new
# features; the build's own hidden checks are run again for regressions.
# The reference implementation in reference/ passes both, and the build's
# reference none of these.
timeout_minutes: 90
request: request.md
persona: ../user/dev/persona.md
notes: notes.md
max_replies: 10
