# The same requests made of a single agent and of an agent asked to use
# subagents in parallel, on two tasks of similar size: five independent
# modules (independent), and a SQL engine whose tokenizer, parser, and
# evaluator depend on each other (coupled). In the single conditions the
# CLI's subagent tool is turned off; nothing in the prompt says so. Hidden
# checks in checks/ score the results; the reference implementations in
# reference/ pass all of them and the stub fixtures none.
timeout_minutes: 60
conditions:
  independent-single:
    task: independent
    project_name: devkit
    fixture: fixtures/independent
    prompt: prompts/independent-single.md
    subagents: false
  independent-multi:
    task: independent
    project_name: devkit
    fixture: fixtures/independent
    prompt: prompts/independent-multi.md
    subagents: true
  coupled-single:
    task: coupled
    project_name: minisql
    fixture: fixtures/coupled
    prompt: prompts/coupled-single.md
    subagents: false
  coupled-multi:
    task: coupled
    project_name: minisql
    fixture: fixtures/coupled
    prompt: prompts/coupled-multi.md
    subagents: true
