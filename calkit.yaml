questions:
  - If code quality of an initial codebase is poor, will AI make it
    worse, better, or keep it the same?
  - Will AI agents follow reproducibility best practices (version control,
    environment management, pipeline with hashed I/O, defined provenance) by
    default?
  - What degrees of vibe coding are appropriate for what stage of software
    product development?
